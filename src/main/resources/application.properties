spring.application.name=grad_project
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/grad_project}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:zeyad}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update

spring.security.user.name=${DEFAULT_USER_NAME:zeyad}
spring.security.user.password=${DEFAULT_USER_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:zeyad-tharwat}
app.jwt.exp-minutes=${JWT_EXP_MINUTES:120}

server.address=0.0.0.0
